{% extends "locker/base.html" %}
{% block title %}Confirm delete - AI Digital Locker{% endblock %}
{% block content %}
<div class="card" style="max-width:460px">
  <h2>Delete document</h2>
  <p>Are you sure you want to delete this document? <strong>This cannot be undone.</strong></p>
  <form method="post">
    {% csrf_token %}
    <p>
      <button type="submit" class="danger">Yes, delete</button>
      <a class="btn secondary" href="{% url 'locker:dashboard' %}">Cancel</a>
    </p>
  </form>
</div>
{% endblock %}
